<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // GitHub Pages SPA fix — https://github.com/rafgraph/spa-github-pages
      // Khi GitHub Pages gặp URL không tìm thấy file, nó trả về 404.html.
      // Script này chuyển đổi URL thành query string rồi redirect về index.html.
      var pathSegmentsToKeep = 1; // số path segment của repo name: /english-ms-giang/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
